<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <radialGradient id="orb1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orb2">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <filter id="blur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#grid)"/>

  <!-- Ambient glows -->
  <circle cx="80" cy="40" r="230" fill="url(#orb1)" filter="url(#blur)"/>
  <circle cx="1120" cy="240" r="250" fill="url(#orb2)" filter="url(#blur)"/>

  <!-- Decorative lines -->
  <path d="M0 235 C220 190 350 270 560 225 S930 175 1200 225"
        fill="none"
        stroke="url(#glow)"
        stroke-width="2"
        opacity="0.35"/>

  <path d="M0 250 C220 205 350 285 560 240 S930 190 1200 240"
        fill="none"
        stroke="#38bdf8"
        stroke-width="1"
        opacity="0.15"/>

  <!-- Code-style decoration -->
  <g fill="#38bdf8" opacity="0.45" font-family="monospace" font-size="18">
    <text x="55" y="65">&lt;/&gt;</text>
    <text x="1080" y="75">{ }</text>
    <text x="72" y="220">01</text>
    <text x="1090" y="215">0101</text>
  </g>

  <!-- Main content -->
  <text x="600"
        y="105"
        text-anchor="middle"
        fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="48"
        font-weight="700"
        letter-spacing="1">
    Nishal Kumar Pandit
  </text>

  <!-- Accent line -->
  <rect x="435" y="125" width="330" height="3" rx="2" fill="url(#glow)"/>

  <!-- Subtitle -->
  <text x="600"
        y="165"
        text-anchor="middle"
        fill="#cbd5e1"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        font-weight="500">
    Python &amp; Django Developer | Full Stack Web Engineer
  </text>

  <!-- Tech tags -->
  <g font-family="Arial, Helvetica, sans-serif"
     font-size="13"
     font-weight="600"
     text-anchor="middle">

    <rect x="395" y="190" width="85" height="28" rx="14"
          fill="#38bdf8" fill-opacity="0.10"
          stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="437" y="209" fill="#7dd3fc">PYTHON</text>

    <rect x="490" y="190" width="85" height="28" rx="14"
          fill="#22d3ee" fill-opacity="0.10"
          stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="532" y="209" fill="#67e8f9">DJANGO</text>

    <rect x="585" y="190" width="85" height="28" rx="14"
          fill="#818cf8" fill-opacity="0.10"
          stroke="#818cf8" stroke-opacity="0.45"/>
    <text x="627" y="209" fill="#a5b4fc">REST API</text>

    <rect x="680" y="190" width="125" height="28" rx="14"
          fill="#38bdf8" fill-opacity="0.10"
          stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="742" y="209" fill="#7dd3fc">FULL STACK</text>

  </g>

  <!-- Bottom fade -->
  <rect y="255" width="1200" height="25"
        fill="url(#bg)"
        opacity="0.75"/>

</svg>
